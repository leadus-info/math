<svg viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="正三角形（P）から二等辺三角形（Q）への「ならば」の矢印を示し、Pに十分条件、Qに必要条件のラベルを付けて対応関係を表す図">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- left box: P -->
  <rect x="30" y="60" width="160" height="60" rx="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="110" y="85" font-size="16" font-weight="bold" text-anchor="middle" fill="currentColor">P</text>
  <text x="110" y="105" font-size="13" text-anchor="middle" fill="currentColor">（正三角形）</text>

  <!-- right box: Q -->
  <rect x="290" y="60" width="160" height="60" rx="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="370" y="85" font-size="16" font-weight="bold" text-anchor="middle" fill="currentColor">Q</text>
  <text x="370" y="105" font-size="13" text-anchor="middle" fill="currentColor">（二等辺三角形）</text>

  <!-- arrow P => Q -->
  <line x1="190" y1="90" x2="290" y2="90" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="240" y="80" font-size="13" text-anchor="middle" fill="currentColor">ならば</text>

  <!-- leader line + label under P -->
  <line x1="110" y1="150" x2="110" y2="168" stroke="currentColor" stroke-width="1"/>
  <text x="110" y="183" font-size="13" text-anchor="middle" fill="currentColor">十分条件</text>

  <!-- leader line + label under Q -->
  <line x1="370" y1="150" x2="370" y2="168" stroke="currentColor" stroke-width="1"/>
  <text x="370" y="183" font-size="13" text-anchor="middle" fill="currentColor">必要条件</text>
</svg>
