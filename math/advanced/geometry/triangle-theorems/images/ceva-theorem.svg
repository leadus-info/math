<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="三角形ABCの内部の点Pを通る3本の直線AD、BE、CFが対辺と交わり、比の積が1になることを示す図">
  <polygon points="200,50 70,300 330,300" fill="none" stroke="currentColor" stroke-width="2"/>
