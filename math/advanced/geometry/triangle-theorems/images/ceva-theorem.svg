  <line x1="70" y1="300" x2="270" y2="184" stroke="currentColor" stroke-width="1.5"/>
  <line x1="330" y1="300" x2="124" y2="197" stroke="currentColor" stroke-width="1.5"/>

  <circle cx="200" cy="50" r="3" fill="currentColor"/>
  <circle cx="70" cy="300" r="3" fill="currentColor"/>
  <circle cx="330" cy="300" r="3" fill="currentColor"/>
