<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="頂角Aの二等分線ADが対辺BCをBD:DC=AB:ACに内分することを示す図。頂点Cを通りADに平行な直線と直線ABの交点Eも示す">
  <polygon points="150,180 30,280 370,280" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="150" y1="180" x2="163.5" y2="280" stroke="currentColor" stroke-width="2"/>
  <line x1="370" y1="280" x2="335.6" y2="25.3" stroke="currentColor" stroke-width="2"/>

  <!-- equal-angle arcs at A -->
  <path d="M 125.4,200.5 A 32,32 0 0 1 154.3,211.7" fill="none" stroke="currentColor" stroke-width="1"/>
  <path d="M 154.3,211.7 A 32,32 0 0 1 179.1,193.2" fill="none" stroke="currentColor" stroke-width="1"/>

  <circle cx="150" cy="180" r="3" fill="currentColor"/>
  <circle cx="30" cy="280" r="3" fill="currentColor"/>
  <circle cx="370" cy="280" r="3" fill="currentColor"/>
  <circle cx="163.5" cy="280" r="3" fill="currentColor"/>
  <circle cx="335.6" cy="25.3" r="3" fill="currentColor"/>

  <text x="150" y="165" font-size="16" text-anchor="middle" fill="currentColor">A</text>
  <text x="12" y="290" font-size="16" text-anchor="middle" fill="currentColor">B</text>
  <text x="382" y="290" font-size="16" text-anchor="middle" fill="currentColor">C</text>
  <text x="163.5" y="300" font-size="16" text-anchor="middle" fill="currentColor">D</text>
  <text x="343" y="21" font-size="16" text-anchor="start" fill="currentColor">E</text>

  <text x="150" y="20" font-size="13" text-anchor="middle" fill="currentColor">BD : DC = AB : AC</text>
</svg>
