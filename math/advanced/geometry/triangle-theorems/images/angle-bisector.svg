<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="頂角Aの二等分線ADが対辺BCをBD:DC=AB:ACに内分することを示す図">
  <polygon points="160,60 60,280 320,280" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="160" y1="60" x2="182" y2="280" stroke="currentColor" stroke-width="2"/>

  <!-- equal-angle arcs at A -->
  <path d="M 148,88 A 32,32 0 0 1 163,92" fill="none" stroke="currentColor" stroke-width="1"/>
  <path d="M 163,92 A 32,32 0 0 1 175,90" fill="none" stroke="currentColor" stroke-width="1"/>

  <circle cx="160" cy="60" r="3" fill="currentColor"/>
  <circle cx="60" cy="280" r="3" fill="currentColor"/>
  <circle cx="320" cy="280" r="3" fill="currentColor"/>
  <circle cx="182" cy="280" r="3" fill="currentColor"/>

  <text x="160" y="45" font-size="16" text-anchor="middle" fill="currentColor">A</text>
  <text x="42" y="290" font-size="16" text-anchor="middle" fill="currentColor">B</text>
  <text x="338" y="290" font-size="16" text-anchor="middle" fill="currentColor">C</text>
  <text x="182" y="300" font-size="16" text-anchor="middle" fill="currentColor">D</text>

  <text x="200" y="20" font-size="13" fill="currentColor">BD : DC = AB : AC</text>
</svg>
