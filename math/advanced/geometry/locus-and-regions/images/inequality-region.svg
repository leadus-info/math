<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="y≤-x+4、y≥x-2、x≥0を同時に満たす領域が3本の境界線に囲まれた三角形になることを示す図">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <!-- axes -->
  <line x1="55" y1="280" x2="330" y2="280" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="100" y1="390" x2="100" y2="85" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="335" y="285" font-size="13" fill="currentColor">x</text>
  <text x="105" y="88" font-size="13" fill="currentColor">y</text>

  <!-- dashed extensions of the boundary lines beyond the region -->
  <line x1="65" y1="105" x2="100" y2="140" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="205" y1="245" x2="275" y2="315" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="65" y1="385" x2="100" y2="350" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="205" y1="245" x2="275" y2="175" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- triangular region -->
  <polygon points="100,140 100,350 205,245" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="2"/>

  <!-- vertices -->
  <circle cx="100" cy="140" r="3" fill="currentColor"/>
  <circle cx="100" cy="350" r="3" fill="currentColor"/>
  <circle cx="205" cy="245" r="3" fill="currentColor"/>
  <text x="70" y="135" font-size="13" text-anchor="end" fill="currentColor">(0, 4)</text>
  <text x="70" y="355" font-size="13" text-anchor="end" fill="currentColor">(0, -2)</text>
  <text x="215" y="238" font-size="13" fill="currentColor">(3, 1)</text>

  <!-- boundary line labels -->
  <text x="280" y="105" font-size="13" fill="currentColor">y = -x+4</text>
  <text x="280" y="170" font-size="13" fill="currentColor">y = x-2</text>
  <text x="108" y="105" font-size="13" fill="currentColor">x = 0</text>
</svg>
