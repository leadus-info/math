<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="2点A(1,2)とB(4,6)を結ぶ線分を斜辺とし、横3・縦4の直角三角形から距離5が三平方の定理で求まることを示す図">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <!-- axes -->
  <line x1="40" y1="280" x2="270" y2="280" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="60" y1="300" x2="60" y2="20" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="274" y="285" font-size="13" fill="currentColor">x</text>
  <text x="66" y="22" font-size="13" fill="currentColor">y</text>

  <!-- right-angle corner marker -->
  <path d="M210,200 L210,190 L220,190" fill="none" stroke="currentColor" stroke-width="1"/>

  <!-- triangle legs -->
  <line x1="100" y1="200" x2="220" y2="200" stroke="currentColor" stroke-width="2"/>
  <line x1="220" y1="200" x2="220" y2="40" stroke="currentColor" stroke-width="2"/>
  <!-- hypotenuse AB -->
  <line x1="100" y1="200" x2="220" y2="40" stroke="currentColor" stroke-width="2"/>

  <!-- points -->
  <circle cx="100" cy="200" r="3" fill="currentColor"/>
  <circle cx="220" cy="40" r="3" fill="currentColor"/>
  <text x="82" y="215" font-size="16" fill="currentColor">A(1, 2)</text>
  <text x="228" y="35" font-size="16" fill="currentColor">B(4, 6)</text>

  <!-- leg labels -->
  <text x="160" y="218" font-size="13" text-anchor="middle" fill="currentColor">|x₂-x₁| = 3</text>
  <text x="230" y="125" font-size="13" fill="currentColor">|y₂-y₁| = 4</text>
  <text x="130" y="110" font-size="16" fill="currentColor">|AB| = 5</text>
</svg>
