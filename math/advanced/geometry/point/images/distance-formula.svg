<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="2点A(-2,1)とB(2,4)を結ぶ線分を斜辺とし、横4・縦3の直角三角形から距離5が三平方の定理で求まることを示す図">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <!-- axes (origin at (160,240)) -->
  <line x1="30" y1="240" x2="380" y2="240" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="160" y1="300" x2="160" y2="20" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="384" y="245" font-size="13" fill="currentColor">x</text>
  <text x="166" y="22" font-size="13" fill="currentColor">y</text>
  <text x="150" y="258" font-size="13" text-anchor="end" fill="currentColor">O</text>

  <!-- right-angle corner marker -->
  <path d="M230,200 L230,190 L240,190" fill="none" stroke="currentColor" stroke-width="1"/>

  <!-- triangle legs -->
  <line x1="80" y1="200" x2="240" y2="200" stroke="currentColor" stroke-width="2"/>
  <line x1="240" y1="200" x2="240" y2="80" stroke="currentColor" stroke-width="2"/>
  <!-- hypotenuse AB -->
  <line x1="80" y1="200" x2="240" y2="80" stroke="currentColor" stroke-width="2"/>

  <!-- points: A(-2,1) is left of and above the origin, B(2,4) is right of and further above -->
  <circle cx="80" cy="200" r="3" fill="currentColor"/>
  <circle cx="240" cy="80" r="3" fill="currentColor"/>
  <text x="70" y="190" font-size="16" text-anchor="end" fill="currentColor">A(-2, 1)</text>
  <text x="248" y="72" font-size="16" fill="currentColor">B(2, 4)</text>

  <!-- leg labels -->
  <text x="160" y="218" font-size="13" text-anchor="middle" fill="currentColor">|x₂-x₁| = 4</text>
  <text x="248" y="145" font-size="13" fill="currentColor">|y₂-y₁| = 3</text>
  <text x="135" y="125" font-size="16" text-anchor="end" fill="currentColor">|AB| = 5</text>
</svg>
