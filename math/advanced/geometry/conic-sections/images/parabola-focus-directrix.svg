<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="放物線上の点Pから焦点Fまでの距離PFと、準線ℓまでの距離PHが等しいことを示す図">
  <!-- directrix -->
  <line x1="80" y1="20" x2="80" y2="280" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="60" y="16" font-size="13" fill="currentColor">準線 ℓ</text>

  <!-- parabola opening rightward, vertex (150,150), focus (220,150) -->
  <path d="M185.7,50 Q150,100 150,150 Q150,200 185.7,250" fill="none" stroke="currentColor" stroke-width="2"/>

  <!-- focus -->
  <circle cx="220" cy="150" r="3" fill="currentColor"/>
  <text x="228" y="146" font-size="16" fill="currentColor">F</text>

  <!-- point P on parabola -->
  <circle cx="162.9" cy="90" r="3" fill="currentColor"/>
  <text x="150" y="78" font-size="16" fill="currentColor">P</text>

  <!-- PF segment -->
  <line x1="162.9" y1="90" x2="220" y2="150" stroke="currentColor" stroke-width="1.5"/>
  <!-- PH segment (perpendicular to directrix) -->
  <line x1="162.9" y1="90" x2="80" y2="90" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="80" cy="90" r="3" fill="currentColor"/>
  <text x="50" y="80" font-size="16" fill="currentColor">H</text>

  <text x="200" y="280" font-size="13" text-anchor="middle" fill="currentColor">PF = PH(焦点からの距離 = 準線までの距離)</text>
</svg>
