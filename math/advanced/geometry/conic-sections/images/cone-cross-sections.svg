<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="円錐を平面で切る角度によって切り口の曲線が変わることを示す3つの図。左:平面が母線より緩やかな角度で円錐の側面を一周して切ると、閉じた楕円になる。中央:平面が母線と平行な角度で切ると、底面の縁まで達して開いた形の放物線になる。右:頂点を共有する上下2つの円錐(二重円錐)を、平面が母線より急な角度で上下両方の円錐を貫くように切ると、上下それぞれの円錐に1本ずつ現れる2本の曲線からなる双曲線になる。">

  <!-- ============ Panel 1: 楕円 (single cone, gentle-angle cut) ============ -->
  <g>
    <!-- generators -->
    <line x1="110" y1="25" x2="35" y2="195" stroke="currentColor" stroke-width="2"/>
    <line x1="110" y1="25" x2="185" y2="195" stroke="currentColor" stroke-width="2"/>
    <!-- base rim: back (hidden) half dashed -->
    <path d="M35,195 A75,20 0 0 0 185,195" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- base rim: front (visible) half solid -->
    <path d="M35,195 A75,20 0 0 1 185,195" fill="none" stroke="currentColor" stroke-width="2"/>
    <!-- cross-section: closed oval tilted at a gentle angle, entirely inside the lateral surface -->
    <ellipse cx="117" cy="125" rx="44" ry="20" transform="rotate(29 117 125)" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <text x="110" y="248" font-size="15" text-anchor="middle" fill="currentColor">楕円</text>
  </g>

  <!-- ============ Panel 2: 放物線 (single cone, cut parallel to a generator) ============ -->
  <g>
    <!-- generators -->
    <line x1="320" y1="25" x2="245" y2="195" stroke="currentColor" stroke-width="2"/>
    <line x1="320" y1="25" x2="395" y2="195" stroke="currentColor" stroke-width="2"/>
    <!-- base rim: back (hidden) half dashed -->
    <path d="M245,195 A75,20 0 0 0 395,195" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- base rim: front (visible) half solid -->
    <path d="M245,195 A75,20 0 0 1 395,195" fill="none" stroke="currentColor" stroke-width="2"/>
    <!-- cross-section: open curve starting on the left generator (not at the apex), widening as it descends and terminating at the base rim -->
    <path d="M299,72 Q268,140 320,175 Q350,195 377,208" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <text x="320" y="248" font-size="15" text-anchor="middle" fill="currentColor">放物線</text>
  </g>

  <!-- ============ Panel 3: 双曲線 (double cone, steep near-axis cut) ============ -->
  <g>
    <!-- generators, upper nappe -->
    <line x1="530" y1="120" x2="462" y2="25" stroke="currentColor" stroke-width="2"/>
    <line x1="530" y1="120" x2="598" y2="25" stroke="currentColor" stroke-width="2"/>
    <!-- generators, lower nappe -->
    <line x1="530" y1="120" x2="462" y2="215" stroke="currentColor" stroke-width="2"/>
    <line x1="530" y1="120" x2="598" y2="215" stroke="currentColor" stroke-width="2"/>

    <!-- upper base rim: half nearer the shared apex is hidden (dashed) -->
    <path d="M462,25 A68,15 0 0 1 598,25" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- upper base rim: half farther from the apex is visible (solid) -->
    <path d="M462,25 A68,15 0 0 0 598,25" fill="none" stroke="currentColor" stroke-width="2"/>

    <!-- lower base rim: half nearer the shared apex is hidden (dashed) -->
    <path d="M462,215 A68,15 0 0 0 598,215" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- lower base rim: half farther from the apex is visible (solid) -->
    <path d="M462,215 A68,15 0 0 1 598,215" fill="none" stroke="currentColor" stroke-width="2"/>

    <!-- cross-section: plane parallel to the axis at depth 30 in front of it; two branches, one per nappe -->
    <polyline points="474.3,31.6 478.3,36.5 482.3,41.2 486.2,45.9 490.2,50.4 494.2,54.7 498.2,58.9 502.1,62.8 506.1,66.4 510.1,69.7 514.1,72.6 518.1,74.9 522.0,76.6 526.0,77.7 530.0,78.1 534.0,77.7 538.0,76.6 541.9,74.9 545.9,72.6 549.9,69.7 553.9,66.4 557.9,62.8 561.8,58.9 565.8,54.7 569.8,50.4 573.8,45.9 577.7,41.2 581.7,36.5 585.7,31.6" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <polyline points="474.3,208.4 478.3,203.5 482.3,198.8 486.2,194.1 490.2,189.6 494.2,185.3 498.2,181.1 502.1,177.2 506.1,173.6 510.1,170.3 514.1,167.4 518.1,165.1 522.0,163.4 526.0,162.3 530.0,161.9 534.0,162.3 538.0,163.4 541.9,165.1 545.9,167.4 549.9,170.3 553.9,173.6 557.9,177.2 561.8,181.1 565.8,185.3 569.8,189.6 573.8,194.1 577.7,198.8 581.7,203.5 585.7,208.4" fill="none" stroke="currentColor" stroke-width="2.5"/>

    <text x="530" y="248" font-size="15" text-anchor="middle" fill="currentColor">双曲線</text>
  </g>
</svg>
