<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="三角形の重心G・外心O・垂心Hが同一直線(オイラー線)上にあり、OG:GH=1:2となることを示す図">
  <polygon points="70,200 250,200 130,155" fill="none" stroke="currentColor" stroke-width="2"/>
  <circle cx="70" cy="200" r="3" fill="currentColor"/>
  <circle cx="250" cy="200" r="3" fill="currentColor"/>
  <circle cx="130" cy="155" r="3" fill="currentColor"/>
  <text x="56" y="212" font-size="16" fill="currentColor">A</text>
  <text x="256" y="212" font-size="16" fill="currentColor">B</text>
  <text x="116" y="145" font-size="16" fill="currentColor">C</text>

  <!-- Euler line through O, G, H -->
  <line x1="160" y1="257.5" x2="130" y2="40" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>

  <circle cx="160" cy="257.5" r="3" fill="currentColor"/>
  <circle cx="150" cy="185" r="3" fill="currentColor"/>
  <circle cx="130" cy="40" r="3" fill="currentColor"/>

  <text x="168" y="262" font-size="16" fill="currentColor">O(外心)</text>
  <line x1="153" y1="183" x2="200" y2="161" stroke="currentColor" stroke-width="1"/>
  <text x="203" y="162" font-size="16" text-anchor="start" fill="currentColor">G(重心)</text>
  <text x="100" y="40" font-size="16" text-anchor="end" fill="currentColor">H(垂心)</text>

  <text x="200" y="300" font-size="13" text-anchor="middle" fill="currentColor">オイラー線: O, G, Hは一直線上、OG : GH = 1 : 2</text>
</svg>
