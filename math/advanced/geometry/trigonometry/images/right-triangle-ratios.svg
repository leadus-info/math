<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="直角三角形ABCで角Aに対する対辺・隣辺・斜辺から正弦・余弦・正接を定義することを示す図">
  <polygon points="80,260 320,260 320,60" fill="none" stroke="currentColor" stroke-width="2"/>

  <!-- right angle at C -->
  <path d="M300,260 L300,240 L320,240" fill="none" stroke="currentColor" stroke-width="1"/>

  <circle cx="80" cy="260" r="3" fill="currentColor"/>
  <circle cx="320" cy="260" r="3" fill="currentColor"/>
  <circle cx="320" cy="60" r="3" fill="currentColor"/>

  <text x="64" y="270" font-size="16" fill="currentColor">A</text>
  <text x="320" y="282" font-size="16" text-anchor="middle" fill="currentColor">C</text>
  <text x="320" y="48" font-size="16" text-anchor="middle" fill="currentColor">B</text>

  <text x="200" y="278" font-size="13" text-anchor="middle" fill="currentColor">隣辺 AC</text>
  <text x="332" y="165" font-size="13" fill="currentColor">対辺 BC</text>
  <text x="185" y="150" font-size="13" fill="currentColor">斜辺 AB</text>

  <text x="105" y="245" font-size="13" fill="currentColor">A</text>

  <text x="80" y="300" font-size="13" fill="currentColor">sin A = BC/AB, cos A = AC/AB, tan A = BC/AC</text>
</svg>
