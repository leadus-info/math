<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="半径1の半円周上の点Pの座標を(cosθ,sinθ)と定義することで、鈍角まで三角比を拡張することを示す図">
  <defs>
    <marker id="arrow-obtuse" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- x axis -->
  <line x1="30" y1="250" x2="370" y2="250" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow-obtuse)"/>
  <text x="374" y="255" font-size="13" fill="currentColor">x</text>

  <!-- semicircle radius 1 (r=110 px), center O -->
  <path d="M 90,250 A 110,110 0 0 1 310,250" fill="none" stroke="currentColor" stroke-width="2"/>

  <!-- radius to P (theta = 120 degrees) -->
  <line x1="200" y1="250" x2="145" y2="155.7" stroke="currentColor" stroke-width="2" marker-end="url(#arrow-obtuse)"/>

  <!-- angle arc theta -->
  <path d="M 260,250 A 60,60 0 0 0 170,198.04" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="235" y="215" font-size="13" fill="currentColor">θ</text>

  <!-- perpendicular from P to x-axis -->
  <line x1="145" y1="155.7" x2="145" y2="250" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>

  <circle cx="200" cy="250" r="3" fill="currentColor"/>
  <circle cx="145" cy="155.7" r="3" fill="currentColor"/>
  <circle cx="145" cy="250" r="3" fill="currentColor"/>

  <text x="205" y="268" font-size="13" fill="currentColor">O</text>
  <text x="131" y="244" font-size="13" fill="currentColor">Q</text>
  <text x="110" y="118" font-size="16" fill="currentColor">P(cos θ, sin θ)</text>
  <text x="130" y="268" font-size="13" fill="currentColor">cos θ</text>
  <text x="138" y="205" font-size="13" text-anchor="end" fill="currentColor">sin θ</text>
</svg>
