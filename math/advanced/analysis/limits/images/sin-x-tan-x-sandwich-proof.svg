<svg viewBox="0 0 320 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="単位円上で中心角xの扇形を考え、原点O・x軸上の点A(1,0)・円周上の点B(cos x, sin x)・点Aでの接線上の点T(1, tan x)を結んだ図。三角形OAB(扇形に内接する三角形、面積(1/2)sin x)、扇形OAB自体(面積(1/2)x)、三角形OAT(扇形を含む直角三角形、面積(1/2)tan x)の位置関係を示す">
  <!-- arc of the unit circle from A to B (sector boundary) -->
  <path d="M240,230 A170,170 0 0 0 196.34,116.25" fill="none" stroke="currentColor" stroke-width="2"/>

  <!-- OA (shared base of all three shapes) -->
  <line x1="70" y1="230" x2="240" y2="230" stroke="currentColor" stroke-width="2"/>

  <!-- O through B extended to T -->
  <line x1="70" y1="230" x2="240" y2="76.93" stroke="currentColor" stroke-width="2"/>

  <!-- chord AB (side of the inscribed triangle, distinct from the arc) -->
  <line x1="240" y1="230" x2="196.34" y2="116.25" stroke="currentColor" stroke-width="2"/>

  <!-- tangent segment AT -->
  <line x1="240" y1="230" x2="240" y2="76.93" stroke="currentColor" stroke-width="2"/>

  <!-- dashed height from B down to OA (foot F) -->
  <line x1="196.34" y1="116.25" x2="196.34" y2="230" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- right angle tick at A between OA and AT -->
  <path d="M228,230 L228,218 L240,218" fill="none" stroke="currentColor" stroke-width="1"/>

  <!-- angle arc at O -->
  <path d="M100,230 A30,30 0 0 0 92.29,209.93" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="104" y="214" font-size="13" fill="currentColor">x</text>

  <circle cx="70" cy="230" r="3" fill="currentColor"/>
  <circle cx="240" cy="230" r="3" fill="currentColor"/>
  <circle cx="196.34" cy="116.25" r="3" fill="currentColor"/>
  <circle cx="240" cy="76.93" r="3" fill="currentColor"/>

  <text x="52" y="240" font-size="16" fill="currentColor">O</text>
  <text x="240" y="252" font-size="16" text-anchor="middle" fill="currentColor">A</text>
  <text x="186" y="104" font-size="16" fill="currentColor">B</text>
  <text x="248" y="74" font-size="16" fill="currentColor">T</text>

  <text x="155" y="248" font-size="13" text-anchor="middle" fill="currentColor">1</text>
  <text x="190" y="177" font-size="13" text-anchor="end" fill="currentColor">sin x</text>
  <text x="246" y="157" font-size="13" fill="currentColor">tan x</text>
</svg>
