<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="円を扇形に分割して交互に並べ替えると、底辺が円周の半分（半径×円周率）、高さが半径にそれぞれほぼ等しい平行四辺形に近い形になることを示す図">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- 左: 扇形に分割された円 -->
  <circle cx="110" cy="170" r="90" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="110" y1="170" x2="110.0" y2="80.0" stroke="currentColor" stroke-width="1"/>
  <line x1="110" y1="170" x2="155.0" y2="92.1" stroke="currentColor" stroke-width="1"/>
  <line x1="110" y1="170" x2="187.9" y2="125.0" stroke="currentColor" stroke-width="1"/>
  <line x1="110" y1="170" x2="200.0" y2="170.0" stroke="currentColor" stroke-width="1"/>
  <line x1="110" y1="170" x2="187.9" y2="215.0" stroke="currentColor" stroke-width="1"/>
  <line x1="110" y1="170" x2="155.0" y2="247.9" stroke="currentColor" stroke-width="1"/>
  <line x1="110" y1="170" x2="110.0" y2="260.0" stroke="currentColor" stroke-width="1"/>
  <line x1="110" y1="170" x2="65.0" y2="247.9" stroke="currentColor" stroke-width="1"/>
  <line x1="110" y1="170" x2="32.1" y2="215.0" stroke="currentColor" stroke-width="1"/>
  <line x1="110" y1="170" x2="20.0" y2="170.0" stroke="currentColor" stroke-width="1"/>
  <line x1="110" y1="170" x2="32.1" y2="125.0" stroke="currentColor" stroke-width="1"/>
  <line x1="110" y1="170" x2="65.0" y2="92.1" stroke="currentColor" stroke-width="1"/>
  <circle cx="110" cy="170" r="3" fill="currentColor"/>
  <line x1="110" y1="170" x2="84.1" y2="266.6" stroke="currentColor" stroke-width="0.75" stroke-dasharray="2 2"/>
  <text x="84" y="282" font-size="16" text-anchor="middle" fill="currentColor">中心</text>
  <line x1="110" y1="80" x2="110" y2="60" stroke="currentColor" stroke-width="0.75" stroke-dasharray="2 2"/>
  <text x="110" y="52" font-size="16" text-anchor="middle" fill="currentColor">半径</text>

  <!-- 中央: 並べ替えの矢印 -->
  <line x1="222" y1="170" x2="278" y2="170" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="150" font-size="16" text-anchor="middle" fill="currentColor">並べ替える</text>

  <!-- 右: 12個の扇形を交互に並べ替えた形 -->
  <path d="M320.0,256.9 A90 90 0 0 0 366.6,256.9" fill="none" stroke="currentColor" stroke-width="2"/>
  <path d="M343.3,170.0 A90 90 0 0 1 389.9,170.0" fill="none" stroke="currentColor" stroke-width="2"/>
  <path d="M366.6,256.9 A90 90 0 0 0 413.2,256.9" fill="none" stroke="currentColor" stroke-width="2"/>
  <path d="M389.9,170.0 A90 90 0 0 1 436.5,170.0" fill="none" stroke="currentColor" stroke-width="2"/>
  <path d="M413.2,256.9 A90 90 0 0 0 459.8,256.9" fill="none" stroke="currentColor" stroke-width="2"/>
  <path d="M436.5,170.0 A90 90 0 0 1 483.1,170.0" fill="none" stroke="currentColor" stroke-width="2"/>
  <path d="M459.8,256.9 A90 90 0 0 0 506.3,256.9" fill="none" stroke="currentColor" stroke-width="2"/>
  <path d="M483.1,170.0 A90 90 0 0 1 529.6,170.0" fill="none" stroke="currentColor" stroke-width="2"/>
  <path d="M506.3,256.9 A90 90 0 0 0 552.9,256.9" fill="none" stroke="currentColor" stroke-width="2"/>
  <path d="M529.6,170.0 A90 90 0 0 1 576.2,170.0" fill="none" stroke="currentColor" stroke-width="2"/>
  <path d="M552.9,256.9 A90 90 0 0 0 599.5,256.9" fill="none" stroke="currentColor" stroke-width="2"/>
  <path d="M576.2,170.0 A90 90 0 0 1 622.8,170.0" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="343.3" y1="170.0" x2="320.0" y2="256.9" stroke="currentColor" stroke-width="2"/>
  <line x1="343.3" y1="170.0" x2="366.6" y2="256.9" stroke="currentColor" stroke-width="1"/>
  <line x1="366.6" y1="256.9" x2="389.9" y2="170.0" stroke="currentColor" stroke-width="1"/>
  <line x1="389.9" y1="170.0" x2="366.6" y2="256.9" stroke="currentColor" stroke-width="1"/>
  <line x1="389.9" y1="170.0" x2="413.2" y2="256.9" stroke="currentColor" stroke-width="1"/>
  <line x1="413.2" y1="256.9" x2="436.5" y2="170.0" stroke="currentColor" stroke-width="1"/>
  <line x1="436.5" y1="170.0" x2="413.2" y2="256.9" stroke="currentColor" stroke-width="1"/>
  <line x1="436.5" y1="170.0" x2="459.8" y2="256.9" stroke="currentColor" stroke-width="1"/>
  <line x1="459.8" y1="256.9" x2="483.1" y2="170.0" stroke="currentColor" stroke-width="1"/>
  <line x1="483.1" y1="170.0" x2="459.8" y2="256.9" stroke="currentColor" stroke-width="1"/>
  <line x1="483.1" y1="170.0" x2="506.3" y2="256.9" stroke="currentColor" stroke-width="1"/>
  <line x1="506.3" y1="256.9" x2="529.6" y2="170.0" stroke="currentColor" stroke-width="1"/>
  <line x1="529.6" y1="170.0" x2="506.3" y2="256.9" stroke="currentColor" stroke-width="1"/>
  <line x1="529.6" y1="170.0" x2="552.9" y2="256.9" stroke="currentColor" stroke-width="1"/>
  <line x1="552.9" y1="256.9" x2="576.2" y2="170.0" stroke="currentColor" stroke-width="1"/>
  <line x1="576.2" y1="170.0" x2="552.9" y2="256.9" stroke="currentColor" stroke-width="1"/>
  <line x1="576.2" y1="170.0" x2="599.5" y2="256.9" stroke="currentColor" stroke-width="1"/>
  <line x1="599.5" y1="256.9" x2="622.8" y2="170.0" stroke="currentColor" stroke-width="2"/>

  <!-- 高さの寸法線 -->
  <line x1="300" y1="170.0" x2="343.3" y2="170.0" stroke="currentColor" stroke-width="0.75" stroke-dasharray="2 2"/>
  <line x1="300" y1="256.9" x2="320.0" y2="256.9" stroke="currentColor" stroke-width="0.75" stroke-dasharray="2 2"/>
  <line x1="300" y1="170.0" x2="300" y2="256.9" stroke="currentColor" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="292" y="220" font-size="16" text-anchor="end" fill="currentColor">高さ≈半径</text>
  <text x="619.2" y="222" font-size="16" text-anchor="start" fill="currentColor">半径</text>

  <!-- 底辺の寸法線 -->
  <line x1="320.0" y1="282" x2="599.5" y2="282" stroke="currentColor" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="459.8" y="304" font-size="16" text-anchor="middle" fill="currentColor">底辺≈円周の半分（半径×円周率）</text>
</svg>
