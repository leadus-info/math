<svg viewBox="0 0 280 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="直方体の展開図。縦に「上」「前」「下」「後」の4つの面が並び、「前」の左右に「左」「右」の面がつく。「左」の面の上の辺と「上」の面の左の辺が太線で示され、組み立てるとこの2本が重なって1本の辺になることを表す">
  <g fill="none" stroke="currentColor" stroke-width="2">
    <rect x="100" y="20" width="80" height="40"/>
    <rect x="60" y="60" width="40" height="50"/>
    <rect x="100" y="60" width="80" height="50"/>
    <rect x="180" y="60" width="40" height="50"/>
    <rect x="100" y="110" width="80" height="40"/>
    <rect x="100" y="150" width="80" height="50"/>
  </g>
  <g font-size="16" text-anchor="middle" fill="currentColor">
    <text x="140" y="46">上</text>
    <text x="80" y="91">左</text>
    <text x="140" y="91">前</text>
    <text x="200" y="91">右</text>
    <text x="140" y="136">下</text>
    <text x="140" y="181">後</text>
  </g>
  <line x1="60" y1="60" x2="100" y2="60" stroke="currentColor" stroke-width="4"/>
  <line x1="100" y1="20" x2="100" y2="60" stroke="currentColor" stroke-width="4"/>
  <text x="140" y="222" font-size="14" text-anchor="middle" fill="currentColor">太線の2本は、組み立てると重なる</text>
</svg>
