<svg viewBox="0 0 300 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="四角形ABCDから、頂点Dから辺ABに垂直に下ろした線DEで切り取った三角形AED(薄い色)を、辺ADが辺BCに重なるように右へ移して三角形BFC(薄い色)の位置に置くと、たてがDE(高さ)、よこがEF(底辺ABと同じ長さ)の長方形EFCDになることを表す図">
  <polygon points="60,180 100,180 100,60" fill="currentColor" fill-opacity="0.15" stroke="none"/>
  <polygon points="200,180 240,180 240,60" fill="currentColor" fill-opacity="0.15" stroke="none"/>
  <polygon points="60,180 200,180 240,60 100,60" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="200" y1="180" x2="100" y2="60" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="100" y1="60" x2="100" y2="180" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="240" y1="60" x2="240" y2="180" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="200" y1="180" x2="240" y2="180" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M100,168 L112,168 L112,180" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <path d="M240,168 L228,168 L228,180" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <path d="M84,160 L226,160" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <path d="M226,160 L216,155 M226,160 L216,165" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <circle cx="60" cy="180" r="3" fill="currentColor"/>
  <circle cx="200" cy="180" r="3" fill="currentColor"/>
  <circle cx="240" cy="60" r="3" fill="currentColor"/>
  <circle cx="100" cy="60" r="3" fill="currentColor"/>
  <circle cx="100" cy="180" r="3" fill="currentColor"/>
  <circle cx="240" cy="180" r="3" fill="currentColor"/>
  <text x="60" y="200" font-size="16" text-anchor="middle" fill="currentColor">A</text>
  <text x="200" y="200" font-size="16" text-anchor="middle" fill="currentColor">B</text>
  <text x="240" y="46" font-size="16" text-anchor="middle" fill="currentColor">C</text>
  <text x="100" y="46" font-size="16" text-anchor="middle" fill="currentColor">D</text>
  <text x="100" y="200" font-size="16" text-anchor="middle" fill="currentColor">E</text>
  <text x="240" y="200" font-size="16" text-anchor="middle" fill="currentColor">F</text>
  <text x="170" y="224" font-size="14" text-anchor="middle" fill="currentColor">EF(底辺ABと同じ長さ)</text>
  <text x="105" y="120" font-size="14" text-anchor="start" fill="currentColor">高さ</text>
</svg>
