<svg viewBox="0 0 400 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="正方形が対角線2本(ひし形由来)と向かい合う辺の中点を結ぶ線2本(長方形由来)の、合計4本の対称の軸を持つことを示す図">
  <polygon points="80,80 320,80 320,320 80,320" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="80" y1="80" x2="320" y2="320" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="320" y1="80" x2="80" y2="320" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="200" y1="80" x2="200" y2="320" stroke="currentColor" stroke-width="1.5" stroke-dasharray="1 3"/>
  <line x1="80" y1="200" x2="320" y2="200" stroke="currentColor" stroke-width="1.5" stroke-dasharray="1 3"/>
  <circle cx="200" cy="200" r="3" fill="currentColor"/>
  <line x1="60" y1="368" x2="100" y2="368" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="108" y="373" font-size="13" fill="currentColor">対角線(ひし形由来の軸)</text>
  <line x1="60" y1="398" x2="100" y2="398" stroke="currentColor" stroke-width="1.5" stroke-dasharray="1 3"/>
  <text x="108" y="403" font-size="13" fill="currentColor">中点を結ぶ線(長方形由来の軸)</text>
  <text x="200" y="440" font-size="16" text-anchor="middle" fill="currentColor">正方形は4本の対称の軸を持つ</text>
</svg>
