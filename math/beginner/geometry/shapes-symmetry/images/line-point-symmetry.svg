<svg viewBox="0 0 310 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ひし形の例: 対角線に沿って折るとぴったり重なる線対称な図形であり、対角線の交点を対称の中心として180度回転させてもぴったり重なる点対称な図形でもあることを示す図">
  <polygon points="130,40 200,130 130,220 60,130" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="130" y1="40" x2="130" y2="220" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="60" y1="130" x2="200" y2="130" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="138" y="48" font-size="13" fill="currentColor">対称の軸</text>
  <circle cx="130" cy="130" r="3" fill="currentColor"/>
  <line x1="200" y1="130" x2="212" y2="130" stroke="currentColor" stroke-width="1"/>
  <text x="216" y="134" font-size="13" fill="currentColor">対称の中心</text>
  <text x="130" y="245" font-size="16" text-anchor="middle" fill="currentColor">ひし形の例: 線対称かつ点対称</text>
</svg>
