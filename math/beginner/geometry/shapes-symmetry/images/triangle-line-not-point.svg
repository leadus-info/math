<svg viewBox="0 0 400 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="正三角形は頂点から対辺の中点へ引いた3本の対称の軸を持つ線対称な図形だが、180度回転させると元の位置(実線)から頂点の位置がずれる(破線)ため点対称ではないことを示す図">
  <polygon points="200,80 80,280 320,280" fill="none" stroke="currentColor" stroke-width="2"/>
  <polygon points="200,346.67 320,146.67 80,146.67" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="200" y1="80" x2="200" y2="280" stroke="currentColor" stroke-width="1" stroke-dasharray="1 3"/>
  <line x1="80" y1="280" x2="260" y2="180" stroke="currentColor" stroke-width="1" stroke-dasharray="1 3"/>
  <line x1="320" y1="280" x2="140" y2="180" stroke="currentColor" stroke-width="1" stroke-dasharray="1 3"/>
  <circle cx="200" cy="213.33" r="3" fill="currentColor"/>
  <line x1="60" y1="378" x2="100" y2="378" stroke="currentColor" stroke-width="2"/>
  <text x="108" y="383" font-size="13" fill="currentColor">回転前(対称の軸3本を持つ)</text>
  <line x1="60" y1="405" x2="100" y2="405" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="108" y="410" font-size="13" fill="currentColor">180度回転後(頂点の位置がずれる)</text>
  <text x="200" y="440" font-size="16" text-anchor="middle" fill="currentColor">正三角形は線対称だが点対称ではない</text>
</svg>
