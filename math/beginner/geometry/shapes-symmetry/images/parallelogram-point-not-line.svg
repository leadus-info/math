<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一般の平行四辺形は、左図のように対角線の交点を中心に180度回転させるとぴったり重なるため点対称である一方、右図の例のように直線で折っても頂点の位置(破線)が元の位置(実線)とずれてしまい線対称ではないことを示す図">
  <polygon points="60,300 240,300 300,120 120,120" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="60" y1="300" x2="300" y2="120" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="240" y1="300" x2="120" y2="120" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="180" cy="210" r="3" fill="currentColor"/>
  <text x="180" y="345" font-size="13" text-anchor="middle" fill="currentColor">対角線の交点を中心に180度回転</text>
  <text x="180" y="363" font-size="13" text-anchor="middle" fill="currentColor">すると重なる(点対称)</text>

  <polygon points="410,300 590,300 650,120 470,120" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="530" y1="95" x2="530" y2="325" stroke="currentColor" stroke-width="1" stroke-dasharray="1 3"/>
  <polygon points="650,300 470,300 410,120 590,120" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="530" y="345" font-size="13" text-anchor="middle" fill="currentColor">例えばこの直線で折ると頂点の位置(破線)が</text>
  <text x="530" y="363" font-size="13" text-anchor="middle" fill="currentColor">元の位置(実線)とずれる(線対称でない)</text>

  <text x="360" y="400" font-size="16" text-anchor="middle" fill="currentColor">一般の平行四辺形は点対称だが線対称ではない</text>
</svg>
