<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="1cm²の正方形がたて3個・よこ4個の格子状に並び、たて3cm×よこ4cmの長方形（面積12cm²）を敷き詰めている様子を示す図">
  <defs>
    <marker id="asg-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- 外枠（たて3cm×よこ4cmの長方形） -->
  <rect x="100" y="60" width="200" height="150" fill="none" stroke="currentColor" stroke-width="2"/>

  <!-- 内部の仕切り線（よこ方向の列の境界） -->
  <line x1="150" y1="60" x2="150" y2="210" stroke="currentColor" stroke-width="1"/>
  <line x1="200" y1="60" x2="200" y2="210" stroke="currentColor" stroke-width="1"/>
  <line x1="250" y1="60" x2="250" y2="210" stroke="currentColor" stroke-width="1"/>

  <!-- 内部の仕切り線（たて方向の段の境界） -->
  <line x1="100" y1="110" x2="300" y2="110" stroke="currentColor" stroke-width="1"/>
  <line x1="100" y1="160" x2="300" y2="160" stroke="currentColor" stroke-width="1"/>

  <!-- 単位となる正方形のラベル（左上の1マス） -->
  <text x="125" y="89" font-size="13" text-anchor="middle" fill="currentColor">1cm²</text>

  <!-- よこ方向の寸法線とラベル -->
  <line x1="100" y1="228" x2="300" y2="228" stroke="currentColor" stroke-width="1.5" marker-start="url(#asg-arrow)" marker-end="url(#asg-arrow)"/>
  <text x="200" y="250" font-size="16" text-anchor="middle" fill="currentColor">よこ 4cm</text>

  <!-- たて方向の寸法線とラベル -->
  <line x1="76" y1="60" x2="76" y2="210" stroke="currentColor" stroke-width="1.5" marker-start="url(#asg-arrow)" marker-end="url(#asg-arrow)"/>
  <text x="50" y="135" font-size="16" text-anchor="middle" fill="currentColor" transform="rotate(-90 50 135)">たて 3cm</text>
</svg>
