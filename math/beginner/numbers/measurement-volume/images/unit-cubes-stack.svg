<svg viewBox="0 0 420 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="底面にたて・よこ方向へ1cm³の立方体を敷き詰め、それを高さの分だけ層状に積み重ねて直方体を作る様子を示す図">
  <defs>
    <marker id="uc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- 左パネル: 底面に立方体を並べる -->
  <g stroke="currentColor" fill="none">
    <!-- 底面グリッド外枠（奥行きのオフセットをよこ1列分の見た目の長さに揃え、正方形の集まりに見えるようにする） -->
    <polygon points="50,170 140,170 160,150 70,150" stroke-width="2"/>
    <!-- 底面グリッド内部の仕切り線（よこ方向の段） -->
    <line x1="60" y1="160" x2="150" y2="160" stroke-width="1"/>
    <!-- 底面グリッド内部の仕切り線（たて方向の列） -->
    <line x1="80" y1="170" x2="90" y2="160" stroke-width="1"/>
    <line x1="90" y1="160" x2="100" y2="150" stroke-width="1"/>
    <line x1="110" y1="170" x2="120" y2="160" stroke-width="1"/>
    <line x1="120" y1="160" x2="130" y2="150" stroke-width="1"/>

    <!-- 前面帯（立方体の側面を示し、立体感を補強） -->
    <polyline points="50,170 50,200 140,200 140,170" stroke-width="2"/>
    <line x1="80" y1="170" x2="80" y2="200" stroke-width="1"/>
    <line x1="110" y1="170" x2="110" y2="200" stroke-width="1"/>
    <!-- 奥行き方向の仕切り線に対応する立方体の稜線（隠れ線、点線） -->
    <line x1="100" y1="150" x2="100" y2="180" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="130" y1="150" x2="130" y2="180" stroke-width="1" stroke-dasharray="4 3"/>

    <!-- 右側面（立方体の側面を示し、立体感を補強） -->
    <polyline points="140,170 160,150 160,180 140,200" stroke-width="2"/>
    <line x1="150" y1="160" x2="150" y2="190" stroke-width="1"/>

    <!-- よこ方向の矢印 -->
    <line x1="50" y1="212" x2="140" y2="212" stroke-width="1.5" marker-start="url(#uc-arrow)" marker-end="url(#uc-arrow)"/>
    <!-- たて方向の矢印 -->
    <line x1="36" y1="170" x2="56" y2="150" stroke-width="1.5" marker-start="url(#uc-arrow)" marker-end="url(#uc-arrow)"/>
  </g>
  <text x="95" y="226" font-size="13" text-anchor="middle" fill="currentColor">よこ</text>
  <text x="16" y="164" font-size="13" text-anchor="middle" fill="currentColor">たて</text>
  <text x="109" y="248" font-size="13" text-anchor="middle" fill="currentColor">底面に並べる</text>

  <!-- 右パネル: 高さの分だけ重ねる -->
  <g stroke="currentColor" fill="none">
    <!-- 直方体の可視エッジ -->
    <polyline points="250,170 340,170 340,104 250,104 250,170" stroke-width="2"/>
    <polyline points="340,170 368,142 368,76 340,104" stroke-width="2"/>
    <!-- 上面グリッド（内部の仕切り線） -->
    <line x1="264" y1="90" x2="354" y2="90" stroke-width="1"/>
    <line x1="280" y1="104" x2="294" y2="90" stroke-width="1"/>
    <line x1="294" y1="90" x2="308" y2="76" stroke-width="1"/>
    <line x1="310" y1="104" x2="324" y2="90" stroke-width="1"/>
    <line x1="324" y1="90" x2="338" y2="76" stroke-width="1"/>
    <line x1="278" y1="76" x2="368" y2="76" stroke-width="2"/>
    <line x1="250" y1="104" x2="278" y2="76" stroke-width="2"/>
    <!-- 隠れた奥のエッジ -->
    <polyline points="250,170 278,142 368,142" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="278" y1="142" x2="278" y2="76" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- 段（層）の境界線（薄く表示） -->
    <g opacity="0.5" stroke-width="1">
      <line x1="250" y1="148" x2="340" y2="148"/>
      <line x1="340" y1="148" x2="368" y2="120"/>
      <line x1="250" y1="126" x2="340" y2="126"/>
      <line x1="340" y1="126" x2="368" y2="98"/>
    </g>

    <!-- 高さ方向の矢印 -->
    <line x1="236" y1="170" x2="236" y2="104" stroke-width="1.5" marker-start="url(#uc-arrow)" marker-end="url(#uc-arrow)"/>
  </g>
  <text x="215" y="141" font-size="13" text-anchor="middle" fill="currentColor">高さ</text>
  <text x="309" y="248" font-size="13" text-anchor="middle" fill="currentColor">高さの分だけ重ねる</text>
</svg>
