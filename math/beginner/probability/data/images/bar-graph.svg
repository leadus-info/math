<svg viewBox="0 0 320 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="好きな果物の人数を表した棒グラフ。りんご5人、みかん3人、ぶどう2人の高さの棒が並ぶ">
  <g stroke="currentColor" stroke-width="1" stroke-dasharray="2 3">
    <line x1="60" y1="170" x2="290" y2="170"/>
    <line x1="60" y1="140" x2="290" y2="140"/>
    <line x1="60" y1="110" x2="290" y2="110"/>
    <line x1="60" y1="80" x2="290" y2="80"/>
    <line x1="60" y1="50" x2="290" y2="50"/>
  </g>
  <g stroke="currentColor" stroke-width="2" fill="none">
    <line x1="60" y1="200" x2="290" y2="200"/>
    <line x1="60" y1="200" x2="60" y2="35"/>
    <rect x="85" y="50" width="40" height="150"/>
    <rect x="155" y="110" width="40" height="90"/>
    <rect x="225" y="140" width="40" height="60"/>
  </g>
  <g font-size="14" fill="currentColor" text-anchor="end">
    <text x="52" y="205">0</text>
    <text x="52" y="175">1</text>
    <text x="52" y="145">2</text>
    <text x="52" y="115">3</text>
    <text x="52" y="85">4</text>
    <text x="52" y="55">5</text>
  </g>
  <text x="60" y="25" font-size="14" text-anchor="middle" fill="currentColor">(人)</text>
  <g font-size="16" fill="currentColor" text-anchor="middle">
    <text x="105" y="222">りんご</text>
    <text x="175" y="222">みかん</text>
    <text x="245" y="222">ぶどう</text>
  </g>
</svg>
