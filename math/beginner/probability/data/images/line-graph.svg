<svg viewBox="0 0 360 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ある日の気温の変わり方を表した折れ線グラフ。9時15度、10時17度、11時20度、12時22度、13時21度の点を順に線で結んでいる">
  <g stroke="currentColor" stroke-width="1" stroke-dasharray="2 3">
    <line x1="50" y1="180" x2="330" y2="180"/>
    <line x1="50" y1="150" x2="330" y2="150"/>
    <line x1="50" y1="120" x2="330" y2="120"/>
    <line x1="50" y1="90" x2="330" y2="90"/>
    <line x1="50" y1="60" x2="330" y2="60"/>
  </g>
  <g stroke="currentColor" stroke-width="2" fill="none">
    <line x1="50" y1="210" x2="330" y2="210"/>
    <line x1="50" y1="210" x2="50" y2="45"/>
    <polyline points="80,120 140,108 200,90 260,78 320,84"/>
  </g>
  <g fill="currentColor">
    <circle cx="80" cy="120" r="4"/>
    <circle cx="140" cy="108" r="4"/>
    <circle cx="200" cy="90" r="4"/>
    <circle cx="260" cy="78" r="4"/>
    <circle cx="320" cy="84" r="4"/>
  </g>
  <g font-size="14" fill="currentColor" text-anchor="end">
    <text x="42" y="215">0</text>
    <text x="42" y="185">5</text>
    <text x="42" y="155">10</text>
    <text x="42" y="125">15</text>
    <text x="42" y="95">20</text>
    <text x="42" y="65">25</text>
  </g>
  <text x="50" y="35" font-size="14" text-anchor="middle" fill="currentColor">(度)</text>
  <g font-size="14" fill="currentColor" text-anchor="middle">
    <text x="80" y="230">9</text>
    <text x="140" y="230">10</text>
    <text x="200" y="230">11</text>
    <text x="260" y="230">12</text>
    <text x="320" y="230">13</text>
  </g>
  <text x="340" y="250" font-size="14" text-anchor="end" fill="currentColor">(時)</text>
</svg>
