<svg viewBox="0 0 400 216" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="箱ひげ図の例。数直線上に最小値40、第1四分位数55、中央値（第2四分位数）72.5、第3四分位数85、最大値100を示し、第1四分位数から第3四分位数までを箱、最小値から第1四分位数まで・第3四分位数から最大値までを線（ひげ）で表す">
  <line x1="80" y1="85" x2="80" y2="125" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="140" y1="90" x2="140" y2="125" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="210" y1="90" x2="210" y2="125" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="260" y1="90" x2="260" y2="125" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="320" y1="85" x2="320" y2="125" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3"/>

  <line x1="80" y1="70" x2="140" y2="70" stroke="currentColor" stroke-width="2"/>
  <line x1="260" y1="70" x2="320" y2="70" stroke="currentColor" stroke-width="2"/>
  <line x1="80" y1="55" x2="80" y2="85" stroke="currentColor" stroke-width="2"/>
  <line x1="320" y1="55" x2="320" y2="85" stroke="currentColor" stroke-width="2"/>

  <rect x="140" y="50" width="120" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="210" y1="50" x2="210" y2="90" stroke="currentColor" stroke-width="2"/>

  <line x1="40" y1="130" x2="360" y2="130" stroke="currentColor" stroke-width="1.5"/>
  <line x1="80" y1="125" x2="80" y2="135" stroke="currentColor" stroke-width="1.5"/>
  <line x1="140" y1="125" x2="140" y2="135" stroke="currentColor" stroke-width="1.5"/>
  <line x1="210" y1="125" x2="210" y2="135" stroke="currentColor" stroke-width="1.5"/>
  <line x1="260" y1="125" x2="260" y2="135" stroke="currentColor" stroke-width="1.5"/>
  <line x1="320" y1="125" x2="320" y2="135" stroke="currentColor" stroke-width="1.5"/>

  <text x="80" y="152" font-size="13" text-anchor="middle" fill="currentColor">最小値</text>
  <text x="80" y="170" font-size="13" text-anchor="middle" fill="currentColor">40</text>

  <text x="140" y="185" font-size="13" text-anchor="middle" fill="currentColor">第1四分位数</text>
  <text x="140" y="203" font-size="13" text-anchor="middle" fill="currentColor">55</text>

  <text x="210" y="152" font-size="13" text-anchor="middle" fill="currentColor">中央値</text>
  <text x="210" y="170" font-size="13" text-anchor="middle" fill="currentColor">72.5</text>

  <text x="260" y="185" font-size="13" text-anchor="middle" fill="currentColor">第3四分位数</text>
  <text x="260" y="203" font-size="13" text-anchor="middle" fill="currentColor">85</text>

  <text x="320" y="152" font-size="13" text-anchor="middle" fill="currentColor">最大値</text>
  <text x="320" y="170" font-size="13" text-anchor="middle" fill="currentColor">100</text>
</svg>
