<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="1組と2組の箱ひげ図を共通の数直線の上に上下に並べた図。1組は最小値30、第1四分位数50、中央値60、第3四分位数70、最大値90。2組は最小値40、第1四分位数60、中央値70、第3四分位数75、最大値85。2組の箱は1組の箱より右にあり、長さは短い">
