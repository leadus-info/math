<svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="30人のテストの点数を階級の幅10点で区切ったヒストグラム。40点台と60点台に2つの山がある">
  <!-- axes -->
  <line x1="50" y1="280" x2="510" y2="280" stroke="currentColor" stroke-width="2"/>
  <line x1="50" y1="20" x2="50" y2="280" stroke="currentColor" stroke-width="2"/>

  <!-- bars: class width 10, frequencies 1,2,3,4,7,3,6,2,1,1 (unit = 30px per person) -->
  <rect x="50" y="250" width="46" height="30" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
  <rect x="96" y="220" width="46" height="60" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
  <rect x="142" y="190" width="46" height="90" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
  <rect x="188" y="160" width="46" height="120" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
  <rect x="234" y="70" width="46" height="210" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
  <rect x="280" y="190" width="46" height="90" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
  <rect x="326" y="100" width="46" height="180" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
  <rect x="372" y="220" width="46" height="60" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
  <rect x="418" y="250" width="46" height="30" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
  <rect x="464" y="250" width="46" height="30" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5"/>

  <!-- frequency labels above each bar -->
  <text x="73" y="244" font-size="12" text-anchor="middle" fill="currentColor">1</text>
  <text x="119" y="214" font-size="12" text-anchor="middle" fill="currentColor">2</text>
  <text x="165" y="184" font-size="12" text-anchor="middle" fill="currentColor">3</text>
  <text x="211" y="154" font-size="12" text-anchor="middle" fill="currentColor">4</text>
  <text x="257" y="64" font-size="12" text-anchor="middle" fill="currentColor">7</text>
  <text x="303" y="184" font-size="12" text-anchor="middle" fill="currentColor">3</text>
  <text x="349" y="94" font-size="12" text-anchor="middle" fill="currentColor">6</text>
  <text x="395" y="214" font-size="12" text-anchor="middle" fill="currentColor">2</text>
  <text x="441" y="244" font-size="12" text-anchor="middle" fill="currentColor">1</text>
  <text x="487" y="244" font-size="12" text-anchor="middle" fill="currentColor">1</text>

  <!-- x-axis boundary labels (class boundaries, every 10 points) -->
  <text x="50" y="298" font-size="11" text-anchor="middle" fill="currentColor">0</text>
  <text x="96" y="298" font-size="11" text-anchor="middle" fill="currentColor">10</text>
  <text x="142" y="298" font-size="11" text-anchor="middle" fill="currentColor">20</text>
  <text x="188" y="298" font-size="11" text-anchor="middle" fill="currentColor">30</text>
  <text x="234" y="298" font-size="11" text-anchor="middle" fill="currentColor">40</text>
  <text x="280" y="298" font-size="11" text-anchor="middle" fill="currentColor">50</text>
  <text x="326" y="298" font-size="11" text-anchor="middle" fill="currentColor">60</text>
  <text x="372" y="298" font-size="11" text-anchor="middle" fill="currentColor">70</text>
  <text x="418" y="298" font-size="11" text-anchor="middle" fill="currentColor">80</text>
  <text x="464" y="298" font-size="11" text-anchor="middle" fill="currentColor">90</text>
  <text x="510" y="298" font-size="11" text-anchor="middle" fill="currentColor">100</text>

  <!-- axis titles -->
  <text x="280" y="320" font-size="13" text-anchor="middle" fill="currentColor">点数（点）</text>
  <text x="52" y="14" font-size="13" fill="currentColor">度数（人）</text>
</svg>
