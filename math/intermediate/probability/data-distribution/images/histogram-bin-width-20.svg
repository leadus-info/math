<svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="30人のテストの点数を階級の幅20点で区切ったヒストグラム。40〜60点台付近に1つの山がある">
  <!-- axes -->
  <line x1="50" y1="280" x2="510" y2="280" stroke="currentColor" stroke-width="2"/>
  <line x1="50" y1="20" x2="50" y2="280" stroke="currentColor" stroke-width="2"/>

  <!-- bars: class width 20, frequencies 3,7,10,8,2 (unit = 24px per person) -->
  <rect x="50" y="208" width="92" height="72" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
  <rect x="142" y="112" width="92" height="168" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
  <rect x="234" y="40" width="92" height="240" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
  <rect x="326" y="88" width="92" height="192" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
  <rect x="418" y="232" width="92" height="48" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5"/>

  <!-- frequency labels above each bar -->
  <text x="96" y="202" font-size="12" text-anchor="middle" fill="currentColor">3</text>
  <text x="188" y="106" font-size="12" text-anchor="middle" fill="currentColor">7</text>
  <text x="280" y="34" font-size="12" text-anchor="middle" fill="currentColor">10</text>
  <text x="372" y="82" font-size="12" text-anchor="middle" fill="currentColor">8</text>
  <text x="464" y="226" font-size="12" text-anchor="middle" fill="currentColor">2</text>

  <!-- x-axis boundary labels (class boundaries, every 20 points) -->
  <text x="50" y="298" font-size="11" text-anchor="middle" fill="currentColor">0</text>
  <text x="142" y="298" font-size="11" text-anchor="middle" fill="currentColor">20</text>
  <text x="234" y="298" font-size="11" text-anchor="middle" fill="currentColor">40</text>
  <text x="326" y="298" font-size="11" text-anchor="middle" fill="currentColor">60</text>
  <text x="418" y="298" font-size="11" text-anchor="middle" fill="currentColor">80</text>
  <text x="510" y="298" font-size="11" text-anchor="middle" fill="currentColor">100</text>

  <!-- axis titles -->
  <text x="280" y="320" font-size="13" text-anchor="middle" fill="currentColor">点数（点）</text>
  <text x="52" y="14" font-size="13" fill="currentColor">度数（人）</text>
</svg>
