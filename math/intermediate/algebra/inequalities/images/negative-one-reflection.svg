<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="数直線上で3と5に-1を掛けると、0を挟んで反対側の-3と-5に移ることを示す図">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- 数直線本体 -->
  <line x1="32" y1="140" x2="368" y2="140" stroke="currentColor" stroke-width="1.5"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- 目盛り(整数ごと) -->
  <line x1="32" y1="134" x2="32" y2="146" stroke="currentColor" stroke-width="1"/>
  <line x1="60" y1="134" x2="60" y2="146" stroke="currentColor" stroke-width="1"/>
  <line x1="88" y1="134" x2="88" y2="146" stroke="currentColor" stroke-width="1"/>
  <line x1="116" y1="134" x2="116" y2="146" stroke="currentColor" stroke-width="1"/>
  <line x1="144" y1="134" x2="144" y2="146" stroke="currentColor" stroke-width="1"/>
  <line x1="172" y1="134" x2="172" y2="146" stroke="currentColor" stroke-width="1"/>
  <line x1="200" y1="134" x2="200" y2="146" stroke="currentColor" stroke-width="1"/>
  <line x1="228" y1="134" x2="228" y2="146" stroke="currentColor" stroke-width="1"/>
  <line x1="256" y1="134" x2="256" y2="146" stroke="currentColor" stroke-width="1"/>
  <line x1="284" y1="134" x2="284" y2="146" stroke="currentColor" stroke-width="1"/>
  <line x1="312" y1="134" x2="312" y2="146" stroke="currentColor" stroke-width="1"/>
  <line x1="340" y1="134" x2="340" y2="146" stroke="currentColor" stroke-width="1"/>
  <line x1="368" y1="134" x2="368" y2="146" stroke="currentColor" stroke-width="1"/>

  <!-- 対応する2組の移動を示す円弧矢印(×(-1)) -->
  <path d="M 284,128 Q 200,98 116,128" fill="none" stroke="currentColor" stroke-width="1.5"
        stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M 340,128 Q 200,50 60,128" fill="none" stroke="currentColor" stroke-width="1.5"
        stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="200" y="40" font-size="16" text-anchor="middle" fill="currentColor">×(−1)</text>

  <!-- 主要な点 -->
  <circle cx="200" cy="140" r="3" fill="currentColor"/>
  <circle cx="284" cy="140" r="3" fill="currentColor"/>
  <circle cx="116" cy="140" r="3" fill="currentColor"/>
  <circle cx="340" cy="140" r="3" fill="currentColor"/>
  <circle cx="60" cy="140" r="3" fill="currentColor"/>

  <!-- ラベル -->
  <text x="200" y="168" font-size="16" text-anchor="middle" fill="currentColor">0</text>
  <text x="284" y="168" font-size="16" text-anchor="middle" fill="currentColor">3</text>
  <text x="116" y="168" font-size="16" text-anchor="middle" fill="currentColor">−3</text>
  <text x="340" y="168" font-size="16" text-anchor="middle" fill="currentColor">5</text>
  <text x="60" y="168" font-size="16" text-anchor="middle" fill="currentColor">−5</text>
</svg>
