<svg viewBox="0 0 400 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="二等辺三角形ABC(AB=ACを印で表示)で頂角Aの二等分線(角BADと角CADが等しいことを印で表示)が底辺BCと交わる点をDとする図">
  <polygon points="200,80 90,320 310,320" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="200" y1="80" x2="200" y2="320" stroke="currentColor" stroke-width="2"/>

  <!-- AB = AC -->
  <line x1="139.55" y1="197.5" x2="150.45" y2="202.5" stroke="currentColor" stroke-width="1.5"/>
  <line x1="249.55" y1="202.5" x2="260.45" y2="197.5" stroke="currentColor" stroke-width="1.5"/>

  <!-- angle BAD = angle CAD -->
  <path d="M187.52,107.24 Q192.63,113.7 200,110" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <line x1="198.47" y1="110.38" x2="188.71" y2="108.24" stroke="currentColor" stroke-width="1.5"/>
  <path d="M200,110 Q207.37,113.7 212.48,107.24" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <line x1="201.53" y1="110.38" x2="211.29" y2="108.24" stroke="currentColor" stroke-width="1.5"/>

  <circle cx="200" cy="80" r="3" fill="currentColor"/>
  <circle cx="90" cy="320" r="3" fill="currentColor"/>
  <circle cx="310" cy="320" r="3" fill="currentColor"/>
  <circle cx="200" cy="320" r="3" fill="currentColor"/>
  <text x="200" y="65" font-size="16" text-anchor="middle" fill="currentColor">A</text>
  <text x="72" y="330" font-size="16" text-anchor="middle" fill="currentColor">B</text>
  <text x="328" y="330" font-size="16" text-anchor="middle" fill="currentColor">C</text>
  <text x="200" y="343" font-size="16" text-anchor="middle" fill="currentColor">D</text>
</svg>
