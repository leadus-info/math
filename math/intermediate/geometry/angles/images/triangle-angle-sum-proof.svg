<svg viewBox="0 0 400 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="頂点Aを通り辺BCに平行な直線を引き、頂点Aにできる3つの角のうちBに近い側の角(単一の印)が角Bの錯角、Cに近い側の角(二重の印)が角Cの錯角にあたることから三角形の内角の和が180度になることを示す証明の図">
  <line x1="60" y1="100" x2="380" y2="100" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="220,100 100,300 300,300" fill="none" stroke="currentColor" stroke-width="2"/>

  <!-- angle B (single mark) -->
  <path d="M128,300 Q128.01,284.11 114.4,275.99" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <line x1="120.00" y1="288.66" x2="128.70" y2="283.72" stroke="currentColor" stroke-width="1.5"/>

  <!-- angle at A, left side (single mark, equal to angle B) -->
  <path d="M192,100 Q191.99,115.89 205.59,124.01" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <line x1="200.00" y1="111.36" x2="191.30" y2="116.28" stroke="currentColor" stroke-width="1.5"/>

  <!-- angle C (double mark) -->
  <path d="M272,300 Q273.33,281.95 289.6,274.0" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <line x1="270.68" y1="285.53" x2="279.65" y2="289.95" stroke="currentColor" stroke-width="1.5"/>
  <line x1="275.67" y1="278.16" x2="283.11" y2="284.84" stroke="currentColor" stroke-width="1.5"/>

  <!-- angle at A, right side (double mark, equal to angle C) -->
  <path d="M248,100 Q246.67,118.05 230.4,126.0" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <line x1="249.32" y1="114.47" x2="240.35" y2="110.05" stroke="currentColor" stroke-width="1.5"/>
  <line x1="244.33" y1="121.84" x2="236.89" y2="115.16" stroke="currentColor" stroke-width="1.5"/>

  <circle cx="220" cy="100" r="3" fill="currentColor"/>
  <circle cx="100" cy="300" r="3" fill="currentColor"/>
  <circle cx="300" cy="300" r="3" fill="currentColor"/>
  <text x="220" y="85" font-size="16" text-anchor="middle" fill="currentColor">A</text>
  <text x="82" y="310" font-size="16" text-anchor="middle" fill="currentColor">B</text>
  <text x="318" y="310" font-size="16" text-anchor="middle" fill="currentColor">C</text>
</svg>
