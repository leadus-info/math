  <line x1="248.99" y1="262.14" x2="254.39" y2="251.42" stroke="currentColor" stroke-width="1.5"/>
  <line x1="251.96" y1="263.97" x2="259.13" y2="254.35" stroke="currentColor" stroke-width="1.5"/>
  <text x="262.61" y="243.42" font-size="13" text-anchor="middle" fill="currentColor">6</text>

