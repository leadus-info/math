  <line x1="185.01" y1="128.99" x2="179.23" y2="138.35" stroke="currentColor" stroke-width="1.5"/>
  <text x="196.58" y="142.61" font-size="13" text-anchor="middle" fill="currentColor">3</text>

  <!-- angle 4 (obtuse, double mark) -->
