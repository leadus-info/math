  <line x1="153.38" y1="141.18" x2="144.02" y2="135.40" stroke="currentColor" stroke-width="1.5"/>
  <line x1="148.64" y1="148.84" x2="139.29" y2="143.05" stroke="currentColor" stroke-width="1.5"/>
  <text x="137.39" y="156.58" font-size="13" text-anchor="middle" fill="currentColor">4</text>

  <!-- angle 5 (acute, single mark) -->
  <path d="M214.00,280.00 L214.44,275.23 L215.75,270.62 L217.88,266.33 L220.77,262.51 L224.30,259.27 L228.37,256.74" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <line x1="214.99" y1="271.01" x2="220.77" y2="261.65" stroke="currentColor" stroke-width="1.5"/>
  <text x="203.42" y="257.39" font-size="13" text-anchor="middle" fill="currentColor">5</text>

  <!-- angle 6 (obtuse, double mark) -->
