<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="平行な2直線に横断線が交わってできる8つの角の図。上の交点にできる角を時計回りに角1(左上・鋭角)、角2(右上・鈍角)、角3(右下・鋭角)、角4(左下・鈍角)、下の交点にできる角を同様に角5(左上・鋭角)、角6(右上・鈍角)、角7(右下・鋭角)、角8(左下・鈍角)とする。同じ位置にある角1と角5、角2と角6、角3と角7、角4と角8がそれぞれ同位角の組であり、印(鋭角の角は1本線、鈍角の角は2本線)が同じ角どうしが等しい角である。角4と角6、角3と角5は、2直線の内側で横断線を挟んで反対側にある錯角の組である。角2の対頂角は角4であり(対頂角の性質)、角2と角6は同位角なので等しく、したがって角4も角2・角6と等しくなり、錯角である角4と角6が等しいことが分かる。">
  <!-- two parallel lines -->
  <line x1="40" y1="120" x2="360" y2="120" stroke="currentColor" stroke-width="2"/>
  <line x1="40" y1="280" x2="360" y2="280" stroke="currentColor" stroke-width="2"/>

  <!-- parallel marks (matching chevrons indicate the two lines are parallel) -->
  <path d="M313.00,113.00 L320.00,120.00 L313.00,127.00" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <path d="M313.00,273.00 L320.00,280.00 L313.00,287.00" fill="none" stroke="currentColor" stroke-width="1.5"/>

  <!-- transversal -->
  <line x1="128.70" y1="57.39" x2="271.30" y2="342.61" stroke="currentColor" stroke-width="2"/>

  <!-- angle 1 (acute, single mark) -->
  <path d="M134.00,120.00 L134.44,115.23 L135.75,110.62 L137.88,106.33 L140.77,102.51 L144.30,99.27 L148.37,96.74" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <line x1="134.99" y1="111.01" x2="140.77" y2="101.65" stroke="currentColor" stroke-width="1.5"/>
  <text x="123.42" y="97.39" font-size="13" text-anchor="middle" fill="currentColor">1</text>

  <!-- angle 2 (obtuse, double mark) -->
