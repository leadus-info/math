  <line x1="246.62" y1="258.82" x2="255.98" y2="264.60" stroke="currentColor" stroke-width="1.5"/>
  <line x1="251.36" y1="251.16" x2="260.71" y2="256.95" stroke="currentColor" stroke-width="1.5"/>
  <text x="262.61" y="243.42" font-size="13" text-anchor="middle" fill="currentColor">6</text>

  <!-- angle 7 (acute, single mark) -->
  <path d="M266.00,280.00 L265.56,284.77 L264.25,289.38 L262.12,293.67 L259.23,297.49 L255.70,300.73 L251.63,303.26" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <line x1="265.01" y1="288.99" x2="259.23" y2="298.35" stroke="currentColor" stroke-width="1.5"/>
  <text x="276.58" y="302.61" font-size="13" text-anchor="middle" fill="currentColor">7</text>

  <!-- angle 8 (obtuse, double mark) -->
  <path d="M251.63,303.26 L243.23,305.80 L234.47,305.40 L226.33,302.12 L219.75,296.31 L215.48,288.65 L214.00,280.00" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <line x1="233.38" y1="301.18" x2="224.02" y2="295.40" stroke="currentColor" stroke-width="1.5"/>
  <line x1="228.64" y1="308.84" x2="219.29" y2="303.05" stroke="currentColor" stroke-width="1.5"/>
  <text x="217.39" y="316.58" font-size="13" text-anchor="middle" fill="currentColor">8</text>

  <circle cx="160.00" cy="120.00" r="3" fill="currentColor"/>
  <circle cx="240.00" cy="280.00" r="3" fill="currentColor"/>
</svg>
