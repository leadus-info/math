<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="四角形の中に台形と平行四辺形があり、平行四辺形の中で長方形とひし形が重なる部分が正方形になるという包含関係を示す図">
  <rect x="20" y="30" width="360" height="340" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="35" y="50" font-size="16" fill="currentColor">四角形</text>
  <rect x="40" y="70" width="110" height="90" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="95" y="120" font-size="16" text-anchor="middle" fill="currentColor">台形</text>
  <rect x="170" y="70" width="190" height="280" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="265" y="95" font-size="16" text-anchor="middle" fill="currentColor">平行四辺形</text>
  <circle cx="235" cy="250" r="60" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="300" cy="250" r="60" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="205" y="255" font-size="14" text-anchor="middle" fill="currentColor">長方形</text>
  <text x="330" y="255" font-size="14" text-anchor="middle" fill="currentColor">ひし形</text>
  <text x="267" y="255" font-size="13" text-anchor="middle" fill="currentColor">正方形</text>
</svg>
