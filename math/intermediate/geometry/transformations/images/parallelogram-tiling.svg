  <polygon points="200,170 270,135 270,75 200,110" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="270,255 340,290 340,230 270,195" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="270,195 340,230 340,170 270,135" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
