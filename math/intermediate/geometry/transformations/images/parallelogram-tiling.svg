<svg viewBox="0 0 400 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="合同な平行四辺形を縦に積み重ねた列が、右上がりの列と左上がりの列とで交互に並ぶ敷き詰め模様。左から1列目の中段の平行四辺形がア、そのすぐ右の平行四辺形がイ、アのすぐ上の平行四辺形がウ。アとイの境目の縦の直線を直線ℓとし、模様の上下の外側まで点線で延ばして示している">
