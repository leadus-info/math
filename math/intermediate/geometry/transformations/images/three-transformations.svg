<svg viewBox="0 0 600 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="同じ三角形を平行移動・対称移動・回転移動それぞれで動かした結果を、もとの図形(破線)と移動後の図形(実線)で示す図">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="95" y="30" font-size="16" text-anchor="middle" fill="currentColor">平行移動</text>
  <polygon points="40,190 80,190 40,150" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="110,120 150,120 110,80" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="40" y1="190" x2="110" y2="120" stroke="currentColor" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="295" y="30" font-size="16" text-anchor="middle" fill="currentColor">対称移動</text>
  <line x1="295" y1="50" x2="295" y2="220" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="230,190 270,190 230,150" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="360,190 320,190 360,150" fill="none" stroke="currentColor" stroke-width="2"/>

  <text x="500" y="30" font-size="16" text-anchor="middle" fill="currentColor">回転移動</text>
  <polygon points="430,190 470,190 430,150" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="460,80 460,120 500,80" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="500" y1="150" x2="430" y2="190" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="500" y1="150" x2="460" y2="80" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M500,125 A25,25 0 0,1 525,150" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="500" cy="150" r="3" fill="currentColor"/>
  <text x="482" y="172" font-size="14" fill="currentColor">O</text>
</svg>
