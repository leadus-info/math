<svg viewBox="0 0 600 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="同じ三角形を平行移動・対称移動・回転移動それぞれで動かした結果を、もとの図形(破線)と移動後の図形(実線)で示す図。回転移動は、点Oを中心に反時計回りに90°回している">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="95" y="30" font-size="16" text-anchor="middle" fill="currentColor">平行移動</text>
  <polygon points="40,190 80,190 40,150" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="110,120 150,120 110,80" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="40" y1="190" x2="110" y2="120" stroke="currentColor" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="295" y="30" font-size="16" text-anchor="middle" fill="currentColor">対称移動</text>
  <line x1="295" y1="50" x2="295" y2="220" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="230,190 270,190 230,150" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="360,190 320,190 360,150" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="255" y1="175" x2="335" y2="175" stroke="currentColor" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="500" y="30" font-size="16" text-anchor="middle" fill="currentColor">回転移動</text>
  <polygon points="430,160 470,160 430,120" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="540,190 540,150 500,190" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="500" y1="120" x2="430" y2="120" stroke="currentColor" stroke-width="1" stroke-dasharray="1 3" stroke-linecap="round"/>
  <line x1="500" y1="120" x2="500" y2="190" stroke="currentColor" stroke-width="1" stroke-dasharray="1 3" stroke-linecap="round"/>
  <path d="M486.0,120.0 A14,14 0 0,0 500.0,134.0" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="479" y="146" font-size="13" text-anchor="middle" fill="currentColor">90°</text>
  <path d="M410.7,152.5 A95,95 0 0,0 529.4,210.4" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="500" cy="120" r="3" fill="currentColor"/>
  <text x="506" y="114" font-size="14" fill="currentColor">O</text>
</svg>
