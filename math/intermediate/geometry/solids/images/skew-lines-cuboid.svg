<svg viewBox="0 0 400 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="直方体ABCD-EFGHの辺ABと辺CGを太線で示す図。手前の面がA(左下)・B(右下)・F(右上)・E(左上)、奥の面がD(左下)・C(右下)・G(右上)・H(左上)で、DとHは隠れて見えない頂点。辺AEは頂点Aから真上に伸びる辺。辺ABと辺CGの2辺は隣り合わず、平行でもなく、交わりもしないねじれの位置の関係にある(破線は奥に隠れて見えない辺)">
  <!-- hidden edges -->
  <line x1="310" y1="220" x2="150" y2="220" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="150" y1="220" x2="80" y2="280" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="150" y1="220" x2="150" y2="80" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- visible edges -->
  <line x1="240" y1="280" x2="310" y2="220" stroke="currentColor" stroke-width="2"/>
  <line x1="240" y1="280" x2="240" y2="140" stroke="currentColor" stroke-width="2"/>
  <line x1="240" y1="140" x2="310" y2="80" stroke="currentColor" stroke-width="2"/>
  <line x1="240" y1="140" x2="80" y2="140" stroke="currentColor" stroke-width="2"/>
  <line x1="80" y1="140" x2="80" y2="280" stroke="currentColor" stroke-width="2"/>
  <line x1="310" y1="80" x2="150" y2="80" stroke="currentColor" stroke-width="2"/>
  <line x1="150" y1="80" x2="80" y2="140" stroke="currentColor" stroke-width="2"/>

  <!-- highlighted skew edges AB, CG -->
  <line x1="80" y1="280" x2="240" y2="280" stroke="currentColor" stroke-width="3"/>
  <line x1="310" y1="220" x2="310" y2="80" stroke="currentColor" stroke-width="3"/>

  <circle cx="80" cy="280" r="3" fill="currentColor"/>
  <circle cx="240" cy="280" r="3" fill="currentColor"/>
  <circle cx="310" cy="220" r="3" fill="currentColor"/>
  <circle cx="150" cy="220" r="3" fill="currentColor"/>
  <circle cx="80" cy="140" r="3" fill="currentColor"/>
  <circle cx="240" cy="140" r="3" fill="currentColor"/>
  <circle cx="310" cy="80" r="3" fill="currentColor"/>
  <circle cx="150" cy="80" r="3" fill="currentColor"/>

  <text x="62" y="298" font-size="16" text-anchor="middle" fill="currentColor">A</text>
  <text x="255" y="298" font-size="16" text-anchor="middle" fill="currentColor">B</text>
  <text x="328" y="225" font-size="16" text-anchor="middle" fill="currentColor">C</text>
  <text x="124" y="234" font-size="16" text-anchor="middle" fill="currentColor">D</text>
  <text x="62" y="132" font-size="16" text-anchor="middle" fill="currentColor">E</text>
  <text x="248" y="128" font-size="16" text-anchor="middle" fill="currentColor">F</text>
  <text x="328" y="70" font-size="16" text-anchor="middle" fill="currentColor">G</text>
  <text x="136" y="64" font-size="16" text-anchor="middle" fill="currentColor">H</text>
</svg>
