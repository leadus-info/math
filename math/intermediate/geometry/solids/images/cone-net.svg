<svg viewBox="0 0 600 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="円錐とその展開図。左は円錐の見取図で、頂点と底面の円周上の1点を結ぶ線分を太線で示している。右は展開図で、側面にあたるおうぎ形と、底面にあたる円からなる。おうぎ形の中心は円錐の頂点にあたり、おうぎ形の2本の半径は、どちらも見取図の太線の線分にあたる。おうぎ形の弧は底面の円に1点で接しており、組み立てると弧が底面の円周にぴったり重なるので、弧の長さは底面の円周の長さと等しい">
  <text x="140" y="28" font-size="16" text-anchor="middle" fill="currentColor">見取図</text>
  <text x="430" y="28" font-size="16" text-anchor="middle" fill="currentColor">展開図</text>

  <!-- 見取図: 円錐 -->
  <g fill="none" stroke="currentColor">
    <line x1="140" y1="76" x2="100.3" y2="187.6" stroke-width="2"/>
    <line x1="140" y1="76" x2="179.7" y2="187.6" stroke-width="2"/>
    <path d="M 100.3,187.6 A 40.0,13.0 0 0,0 179.7,187.6" stroke-width="2"/>
    <path d="M 100.3,187.6 A 40.0,13.0 0 0,1 179.7,187.6" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="140" y1="76" x2="160.0" y2="200.4" stroke-width="3.5"/>
  </g>
  <circle cx="140" cy="76" r="3" fill="currentColor"/>
  <text x="140" y="66" font-size="16" text-anchor="middle" fill="currentColor">頂点</text>
  <text x="140" y="226.1" font-size="16" text-anchor="middle" fill="currentColor">底面</text>

  <!-- 展開図: おうぎ形(中心角 120 度 = 360度 × 40/120)と底面の円 -->
  <g fill="none" stroke="currentColor">
    <path d="M 326.1,126.0 A 120.0,120.0 0 0,0 533.9,126.0" stroke-width="2"/>
    <line x1="430" y1="66" x2="326.1" y2="126.0" stroke-width="3.5"/>
    <line x1="430" y1="66" x2="533.9" y2="126.0" stroke-width="3.5"/>
    <circle cx="430" cy="226.0" r="40.0" stroke-width="2"/>
  </g>
  <circle cx="430" cy="66" r="3" fill="currentColor"/>
  <text x="430" y="56" font-size="16" text-anchor="middle" fill="currentColor">頂点</text>
  <text x="430" y="141" font-size="16" text-anchor="middle" fill="currentColor">おうぎ形</text>
  <text x="504.6" y="182.5" font-size="16" text-anchor="start" fill="currentColor">弧</text>
  <text x="482.0" y="232.0" font-size="16" text-anchor="start" fill="currentColor">底面</text>
</svg>
