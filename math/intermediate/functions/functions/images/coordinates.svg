<svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="原点Oで垂直に交わるx軸とy軸をもつ座標平面。点A(2, 3)は原点から右へ2、上へ3の位置にあり、点B(3, -2)は右へ3、下へ2の位置にある。各点から両軸へ垂直に下ろした点線が、軸上の目盛り2と3、3と-2を指している">
  <g stroke="currentColor" stroke-width="0.5" opacity="0.3">
    <line x1="30" y1="20" x2="30" y2="280"/>
    <line x1="20" y1="30" x2="280" y2="30"/>
    <line x1="60" y1="20" x2="60" y2="280"/>
    <line x1="20" y1="60" x2="280" y2="60"/>
    <line x1="90" y1="20" x2="90" y2="280"/>
    <line x1="20" y1="90" x2="280" y2="90"/>
    <line x1="120" y1="20" x2="120" y2="280"/>
    <line x1="20" y1="120" x2="280" y2="120"/>
    <line x1="180" y1="20" x2="180" y2="280"/>
    <line x1="20" y1="180" x2="280" y2="180"/>
    <line x1="210" y1="20" x2="210" y2="280"/>
    <line x1="20" y1="210" x2="280" y2="210"/>
    <line x1="240" y1="20" x2="240" y2="280"/>
    <line x1="20" y1="240" x2="280" y2="240"/>
    <line x1="270" y1="20" x2="270" y2="280"/>
    <line x1="20" y1="270" x2="280" y2="270"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="currentColor">
    <line x1="15" y1="150" x2="280" y2="150"/>
    <polygon points="290,150 280,145 280,155" stroke="none"/>
    <line x1="150" y1="285" x2="150" y2="20"/>
    <polygon points="150,10 145,20 155,20" stroke="none"/>
  </g>
  <g font-size="12" fill="currentColor">
    <text x="30" y="165" text-anchor="middle">-4</text>
    <text x="144" y="274" text-anchor="end">-4</text>
    <text x="60" y="165" text-anchor="middle">-3</text>
    <text x="144" y="244" text-anchor="end">-3</text>
    <text x="90" y="165" text-anchor="middle">-2</text>
    <text x="144" y="214" text-anchor="end">-2</text>
    <text x="120" y="165" text-anchor="middle">-1</text>
    <text x="144" y="184" text-anchor="end">-1</text>
    <text x="180" y="165" text-anchor="middle">1</text>
    <text x="144" y="124" text-anchor="end">1</text>
    <text x="210" y="165" text-anchor="middle">2</text>
    <text x="144" y="94" text-anchor="end">2</text>
    <text x="240" y="165" text-anchor="middle">3</text>
    <text x="144" y="64" text-anchor="end">3</text>
    <text x="270" y="165" text-anchor="middle">4</text>
    <text x="144" y="34" text-anchor="end">4</text>
  </g>
  <g font-size="16" fill="currentColor" font-style="italic">
    <text x="284" y="140" text-anchor="end">x</text>
    <text x="160" y="22">y</text>
  </g>
  <text x="144" y="165" font-size="14" text-anchor="end" fill="currentColor">O</text>
  <g stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3" fill="none">
    <line x1="210" y1="60" x2="210" y2="150"/>
    <line x1="210" y1="60" x2="150" y2="60"/>
    <line x1="240" y1="210" x2="240" y2="170"/>
    <line x1="240" y1="210" x2="150" y2="210"/>
  </g>
  <circle cx="210" cy="60" r="4" fill="currentColor"/>
  <text x="218" y="52" font-size="15" text-anchor="start" fill="currentColor">A(2, 3)</text>
  <circle cx="240" cy="210" r="4" fill="currentColor"/>
  <text x="248" y="228" font-size="15" text-anchor="start" fill="currentColor">B(3, −2)</text>
</svg>
